const days=[{"title":"飞抵河内 · 皇城与老街","route":"吉隆坡 ✈ 河内","stops":["升龙皇城","火车街","三十六古街"],"text":"早上5:30（马来西亚时间）集合于吉隆坡国际机场，办理登机手续后飞往河内。抵达后享用午餐，随后参观升龙皇城，探访越南千年皇城的历史遗迹。接着前往火车街，感受铁路与街巷相邻的独特城市风貌，再漫步三十六古街，欣赏法式旧屋与越式店铺交织的老城景色。","meal":"机上用餐、午餐（按原行程列示；机上餐以机票配套为准）","hotel":"Reyna Luxury Hotel","note":"火车街参观须遵守现场开放及安全管理规定，不保证遇上列车经过。","hotelAddress":"34 P. Mieu Đam, Tu Liem, Hanoi, Vietnam","hotelStay":"22/11/2026"},{"title":"前往沙坝 · 山村与小镇","route":"河内 → 沙坝","stops":["猫猫村","莫阿纳打卡点","古石教堂","沙坝夜市"],"text":"早餐后乘车前往沙坝，走访黑苗族传统山村猫猫村，沿途欣赏山谷与乡村风光。随后前往莫阿纳打卡点，欣赏天门、巨型手掌等艺术装置与山景。接着参观沙坝镇中心的百年古石教堂，晚上漫步沙坝夜市，感受当地手工艺与美食文化。","meal":"早餐、午餐、晚餐","hotel":"Sapa Charm Hotel","note":"河内至沙坝为较长车程；村庄游览涉及步行与台阶，建议穿防滑鞋。","hotelAddress":"032 Muong Hoa Street, Sapa Town, Sapa District, Laocai province","hotelStay":"23/11/2026"},{"title":"番西邦峰 · 云端山景","route":"沙坝 → 番西邦峰（Fansipan）→ 沙坝","stops":["番西邦峰（Fansipan）"],"text":"早餐后，按团队安排前往番西邦峰（Fansipan），欣赏越南北部的高山景致，感受云雾环绕的山间风光。番西邦峰已包含在本次行程内，游览后返回沙坝。具体上山方式、搭乘项目及游览顺序以团队确认为准。","meal":"早餐；午餐、晚餐安排待确认","hotel":"Sapa Charm Hotel","note":"番西邦峰（Fansipan）为本团已包含行程。缆车、孟化单轨火车、峰顶登山小火车及午餐的具体包含项目待旅行社确认。山区气温与沙坝镇有差异，请携带保暖外套，活动以天气及景区开放情况为准。","hotelAddress":"032 Muong Hoa Street, Sapa Town, Sapa District, Laocai province","hotelStay":"24/11/2026"},{"title":"返回河内 · 边境风貌与教堂","route":"沙坝 → 老街口岸一带 → 河内","stops":["河口／老街口岸一带","圣若瑟主教座堂"],"text":"早餐后乘车返回河内。原资料另列中越边界河口口岸景点，可了解老街与中国云南河口之间的边境往来。抵达河内后，参观建于1886年的圣若瑟主教座堂，欣赏哥特式尖塔与玫瑰窗，感受河内的历史建筑风貌。","meal":"早餐、午餐、晚餐","hotel":"Reyna Luxury Hotel","note":"原资料对口岸与返回河内的先后次序表述不清，此处按沿途游览整理；具体停靠地点、是否开放及游览顺序须由旅行社确认，不表示安排跨境。","hotelAddress":"34 P. Mieu Đam, Tu Liem, Hanoi, Vietnam","hotelStay":"25/11/2026"},{"title":"河内送机 · 返回吉隆坡","route":"河内 ✈ 吉隆坡","stops":["早餐与退房","前往机场","搭机返程"],"text":"早餐后办理退房手续，于约定时间前往河内机场。搭乘OD 572航班返回吉隆坡，结束5天4晚河内与沙坝之旅。若送机前有空余时间，可按实际安排短暂自由活动。","meal":"早餐、机上用餐（机上餐以机票配套为准）","hotel":"返回温暖的家","note":"航班12:40起飞，须预留机场交通与办理登机时间，不安排额外远程景点。"}];

const weatherData={};let weatherState='loading';
function weatherLabel(code){if(code===0)return '☀️ 晴';if(code<=3)return '⛅ 晴间多云／多云';if(code<=48)return '🌫️ 雾';if(code<=57)return '🌦️ 毛毛雨';if(code<=67)return '🌧️ 雨';if(code<=77)return '🌨️ 雪';if(code<=82)return '🌦️ 阵雨';if(code<=86)return '🌨️ 阵雪';if(code>=95)return '⛈️ 雷雨';return '天气状况待更新'}
function weatherCard(i){return `<section class="card weather"><div class="eyebrow">DAILY WEATHER · ${dates[i]}</div><h2>当天的天气预报</h2>${weatherDays[i].map(key=>{const place=weatherPlaces[key],entry=weatherData[key],daily=entry?.daily,index=daily?.time?.indexOf(weatherDates[i])??-1;const valid=index>=0&&[daily.temperature_2m_min[index],daily.temperature_2m_max[index],daily.weather_code[index]].every(Number.isFinite);return `<div class="weather-place"><h3>${place.name}</h3>${valid?`<p class="weather-temp">${Math.round(daily.temperature_2m_min[index])}–${Math.round(daily.temperature_2m_max[index])}°C <span>${weatherLabel(daily.weather_code[index])}</span></p><p class="muted">${Number.isFinite(daily.precipitation_probability_max?.[index])?'当日最高降雨概率 '+daily.precipitation_probability_max[index]+'%':'降雨概率暂无数据'} · 越南当地日期</p><p class="muted">获取时间：${entry.updated}（越南时间）</p>`:`<p class="muted">${weatherState==='loading'?'正在获取预报…':weatherState==='failed'?'暂时无法连接天气服务，请联网后重试。':'该日期暂无可用预报，请临近出发时刷新查看。'}</p>`}<p class="muted">${key==='sapa'?'穿衣参考：山区早晚较凉，备保暖外套、雨具与防滑鞋；番西邦峰天气须另行确认。':'穿衣参考：备轻便衣物及薄外套，随身携带雨具，出发前按预报调整。'}</p></div>`}).join('')}<p class="muted">自动获取未来最多16天的预报；远期预报可能调整，缺失数据不会用历史气候替代。</p><p class="muted">来源：<a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a> · <a href="https://www.google.com/search?q=${encodeURIComponent((i===2?'Sapa':'Hanoi Sapa')+' weather '+weatherDates[i])}" target="_blank" rel="noopener noreferrer">查看天气</a></p><button type="button" class="subtle" data-weather-refresh ${weatherState==='loading'?'disabled':''}>${weatherState==='loading'?'获取中…':'刷新天气'}</button><span class="muted" role="status"> 需联网获取</span></section>`}
async function loadWeather(){weatherState='loading';const requests=await Promise.allSettled(Object.entries(weatherPlaces).map(async([key,place])=>{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);try{const url=`https://api.open-meteo.com/v1/forecast?latitude=${place.lat}&longitude=${place.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FHo_Chi_Minh&forecast_days=16`;const response=await fetch(url,{signal:controller.signal});if(!response.ok)throw Error('Weather unavailable');const data=await response.json();if(!Array.isArray(data.daily?.time))throw Error('Invalid weather data');weatherData[key]={daily:data.daily,updated:new Date().toLocaleString('zh-CN',{timeZone:'Asia/Ho_Chi_Minh',hour12:false})};}finally{clearTimeout(timer)}}));weatherState=requests.some(r=>r.status==='rejected')?'failed':'ready';if(view==='trip'){const old=document.querySelector('.weather');if(old)old.outerHTML=weatherCard(current)}}
document.addEventListener('click',e=>{if(e.target.closest('[data-weather-refresh]')){loadWeather();const old=document.querySelector('.weather');if(old)old.outerHTML=weatherCard(current)}});


const distanceLegs=[[["内排机场（HAN）", "河内市区／升龙皇城", "约 28–35 公里", "乘车 · 市区范围估算", "Noi Bai International Airport", "Imperial Citadel of Thang Long"], ["升龙皇城", "火车街（冯兴街一带）", "约 1–1.5 公里", "步行路线参考范围", "Imperial Citadel of Thang Long", "Hanoi Train Street Phung Hung"], ["火车街", "三十六古街", "约 0.5–1.5 公里", "步行 · 视老街入口而异", "Hanoi Train Street Phung Hung", "Hanoi Old Quarter"]], [["河内市区", "沙坝镇中心", "约 320 公里", "乘车 · 跨城路段", "Hanoi Vietnam", "Sa Pa Vietnam"], ["沙坝镇中心", "猫猫村入口", "约 2–3 公里", "道路接驳 · 不含村内游览", "Sapa Stone Church", "Cat Cat Village Sapa"], ["猫猫村入口", "莫阿纳", "约 3–5 公里", "经镇区绕行的规划估算，非直线距离", "Cat Cat Village Sapa", "Moana Sapa"], ["莫阿纳", "古石教堂", "约 1–2 公里", "道路／步行参考范围", "Moana Sapa", "Sapa Stone Church"], ["古石教堂", "沙坝夜市（N1路一带）", "约 1.4–1.6 公里", "步行参考 · 以导游确认的夜市位置为准", "Sapa Stone Church", "Sapa Night Market N1"]], [["沙坝镇中心", "番西邦缆车站", "约 6–7 公里", "上山接驳参考 · 仅道路距离，不含缆车及登山火车里程", "Sapa Stone Church", "Fansipan Cable Car Station Sapa"]], [["沙坝镇中心", "老街口岸一带（越南侧）", "约 35–45 公里", "乘车 · 山路参考范围", "Sa Pa Vietnam", "Lao Cai International Border Gate"], ["老街口岸一带", "河内／圣若瑟主教座堂", "约 285–300 公里", "乘车 · 以最终停靠点和路线为准", "Lao Cai International Border Gate", "St Joseph Cathedral Hanoi"]], [["河内市区（参考点）", "内排机场（HAN）", "约 28–35 公里", "乘车 · 酒店地址确认后核对接送里程", "Hanoi Old Quarter", "Noi Bai International Airport"]]];
function distanceCard(i){return `<div class="distances" style="margin-top:20px;border-top:1px solid var(--line);padding-top:16px"><div class="eyebrow">BETWEEN THE STOPS</div><h3>站与站之间的距离</h3>${i===2?'<p class="muted">今天安排已包含的番西邦峰游览。下列为前往缆车站的道路距离参考，实际接驳方式以团队安排为准。</p>':''}<ol class="distance-list">${distanceLegs[i].map(([from,to,distance,mode,origin,destination])=>{const travelmode=mode.startsWith('步行')?'walking':'driving';const url='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(origin)+'&destination='+encodeURIComponent(destination)+'&travelmode='+travelmode;return `<li><div class="distance-route">${from}<span aria-hidden="true"> → </span>${to}</div><strong class="distance-value">${distance}</strong><p class="muted">${mode}</p><a href="${url}" target="_blank" rel="noopener noreferrer">查看地图路线 ↗</a></li>`}).join('')}</ol><p class="muted">距离为行前规划参考，非实时导航实测；景点入口、酒店位置及最终行车路线可能改变里程。步行与乘车距离不可混用；不含景区内部步行、餐厅及酒店绕行。</p>${i===3?'<p class="muted">口岸停靠及先后顺序仍待旅行社确认，所列为越南侧参考点，不表示跨境。</p>':''}<details><summary class="muted">参考资料与估算说明</summary><p class="muted"><a href="https://visitsapa.com.vn/en/sa-pa-by-car-experience-route-and-safe-driving-tips-6502" target="_blank" rel="noopener noreferrer">河内—沙坝道路参考</a> · <a href="https://www.paraglidingsapa.com/en/sapa-map/sun-plaza" target="_blank" rel="noopener noreferrer">沙坝景点位置参考</a> · <a href="https://www.bestpricetravel.com/travel-guide/sapa-night-market.html" target="_blank" rel="noopener noreferrer">夜市步行参考</a> · <a href="https://www.minhtritravel.vn/en/guides/noi-bai-airport-to-hanoi-old-quarter" target="_blank" rel="noopener noreferrer">机场—市区参考</a> · <a href="https://www.rome2rio.com/s/Hanoi/L%C3%A0o-Cai" target="_blank" rel="noopener noreferrer">河内—老街参考</a></p><p class="muted">上述资料用于判断距离量级；市区短途和入口间范围为规划估算，不是资料直接给出的精确导航结果。猫猫村至莫阿纳按经镇区的道路接驳估算。请点击各段地图，以实际入口及当日路线重新核对。</p></details></div>`}

function dayPage(i){let d=days[i];return `${summary(i)}${weatherCard(i)}${i===0?'':`<aside class="note"><b>行程提醒</b>${d.note}</aside>`}<section class="card"><div class="eyebrow">SLOW TRAVEL NOTES</div><h2>这一天，慢慢走</h2><p style="font-size:13px;color:#6e685e">${d.text}</p>${i===0?`<aside class="note" style="margin:14px 0"><b>火车街行程提醒</b>${d.note}</aside>`:''}<ol class="timeline">${d.stops.map((s,n)=>`<li><span class="num">${n+1}</span><strong>${s}</strong></li>`).join('')}</ol></section>${map(i)}${sightGallery(i)}<section class="card"><div class="eyebrow">STAY & TASTE</div><h2>吃好，也住好</h2><div class="detail"><b>餐食</b><span>${d.meal}</span></div><div class="detail"><b>住宿</b><span>${d.hotel}</span></div>${d.hotelAddress?`<div class="detail"><b>入住</b><span>${d.hotelStay}${i===1||i===2?' · 沙坝连住两晚（23–24/11）':''}</span></div><div class="detail"><b>地址</b><span>${d.hotelAddress}<br><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.hotel+' '+d.hotelAddress)}" target="_blank" rel="noopener noreferrer" style="color:var(--green);text-underline-offset:3px">查看酒店地图 ↗</a></span></div>`:''}</section>`}
function overview(){return `<section class="card"><div class="eyebrow">OUR LITTLE GETAWAY</div><h2>五天，古城与山城的故事</h2><p>2026年11月22日 — 26日<br>吉隆坡 → 河内 → 沙坝 → 河内 → 吉隆坡</p><div class="detail"><b>体验</b><span>升龙皇城 · 火车街 · 猫猫村 · 莫阿纳 · 沙坝夜市 · 番西邦峰（已含）</span></div><div class="detail"><b>美食</b><span>三文鱼火锅、越式风味、法式风味。原资料未注明具体安排日期，以旅行社确认为准。</span></div>${flight(0)}${flight(4)}<button class="wide" id="print">打印 / 保存完整行程 PDF</button></section>${days.map((d,i)=>`<section class="card"><div class="eyebrow">${dates[i]} · DAY ${i+1}</div><h3>${d.title}</h3><button class="subtle" data-day="${i}">查看当日行程 ↗</button></section>`).join('')}`}
function contactsPage(){return `<section class="card"><div class="eyebrow">TRAVEL CONTACTS</div><h2>旅途联系人</h2><p class="muted">认真规划，真诚相伴。好的旅行体验，不在于花哨的宣传，而在于细节的用心。品质为王，细水长流，懂你所需，珍惜每一次相遇。</p><div class="detail"><b>旅行社</b><span class="agency-name"><strong>E.S. TRAVEL (M) SDN. BHD.</strong> <strong>飞马之旅</strong></span></div><div class="detail"><b>KPL/LN</b><span>3174</span></div><div class="detail"><b>ROB</b><span>398799-K</span></div><div class="detail"><b>地址</b><span>43-F JALAN ONG KIM WEE 75300 MELAKA</span></div><div class="detail"><b>联系人</b><span>SHANICE</span></div><div class="detail"><b>电话</b><span><span style="color:var(--green);font-weight:700;text-underline-offset:3px">+60196266566</span></span></div><a href="https://wa.me/60196266566" target="_blank" rel="noopener noreferrer" class="wide" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box">WhatsApp SHANICE</a><p class="muted" style="margin:6px 0 12px">打开 WhatsApp 后，点击通话图标即可联系 SHANICE。</p><div class="detail"><b>领队</b><span>Ms Hu（SHANICE）<br><span style="color:var(--green);font-weight:700;text-underline-offset:3px">+60 19-626 6566</span><br><a href="https://wa.me/60196266566" target="_blank" rel="noopener noreferrer" class="subtle" style="display:inline-block;margin-top:7px;color:var(--green);text-decoration:none;border:1px solid var(--line)">WhatsApp</a></span></div><div class="detail"><b>导游</b><span>MR TOAN<br><span style="color:var(--green);font-weight:700;text-underline-offset:3px">+84 916 737 113</span><br><a href="https://wa.me/84916737113" target="_blank" rel="noopener noreferrer" class="subtle" style="display:inline-block;margin-top:7px;color:var(--green);text-decoration:none;border:1px solid var(--line)">WhatsApp</a></span></div><p class="muted">WhatsApp 按钮会打开对应号码的聊天；进入后点击通话图标即可拨打，需对方号码已开通 WhatsApp。</p></section>`}
const packingGroups=[["📄", "证件与行程", ["护照原件（建议入境时有效期至少6个月，并留有空白页）", "按本人护照国籍确认越南签证要求，提前办妥所需签证", "确认签证上的姓名、护照号码、有效期及入境口岸", "往返机票、酒店及接送确认单", "旅游保险及紧急联络资料", "证件复印件与电子备份，和原件分开放置"]], ["🧳", "衣物与随身用品", ["轻便透气衣物、替换内衣裤", "薄外套（机舱、车内及山区较凉）", "舒适防滑步行鞋、凉鞋", "雨伞、轻便雨衣、防水袋", "帽子、太阳眼镜、防晒霜", "泳衣及泳衣收纳袋（按行程需要）", "参观教堂等宗教场所时，建议穿着端庄，避免过于暴露。", "个人洗漱用品、纸巾、湿纸巾", "保暖衣服", "厚外套"]], ["💊", "健康准备", ["日常药物带足，并保留原包装；处方药随附处方或医生证明", "按个人需要携带晕车药、肠胃药、创可贴", "防蚊液、免洗洗手液", "如有食物过敏、特殊饮食或行动需求，提前通知旅行负责人"]], ["📱", "手机与付款", ["手机、充电器、充电线、移动电源", "开通国际漫游，或准备适用的SIM卡／eSIM", "转换插头（越南常用电压为220V，插座类型可能不同）", "少量越南盾现金及可境外使用的银行卡", "下载离线地图、翻译工具，保存酒店地址和联络电话"]], ["✈️", "出发前确认", ["核对机票日期、姓名、航站楼及集合时间", "建议提前3小时抵达机场，具体以航空公司要求为准", "确认托运行李、手提行李的重量与尺寸限制", "手提液体一般每容器不超过100毫升，按机场安检要求装袋", "移动电源随身携带，不放入托运行李，并确认航空公司限制", "贵重物品、证件及必需药物随身携带"]]];
function packingPage(){const total=packingGroups.reduce((n,g)=>n+g[2].length,0);const complete=packingGroups.reduce((n,g,gi)=>n+g[2].filter((_,i)=>checks.includes(`pack-${gi}-${i}`)).length,0);return `<section class="card"><div class="eyebrow">READY FOR THE JOURNEY</div><h2>出发前，整理行囊</h2><p class="muted">分组整理，安心出发。勾选状态保存在当前浏览器。</p><p id="pack-progress" class="muted" role="status">已准备 ${complete} / ${total} 项</p></section>${packingGroups.map(([icon,title,items],gi)=>`<section class="card"><h3>${icon} ${title}</h3>${items.map((item,i)=>{const key=`pack-${gi}-${i}`;return `<label class="check"><input type="checkbox" data-check="${key}" ${checks.includes(key)?'checked':''}><span>${item}</span></label>`}).join('')}</section>`).join('')}<section class="card"><div class="eyebrow">HANOI & SAPA TRAVEL NOTES</div><h3>🧥 河内与沙坝出游提醒</h3><p style="font-size:12px">11月河内与沙坝气温有差异，沙坝山区早晚较凉，可能有雾或降雨。请携带保暖外套、雨具和防滑鞋，出发前查看天气，山区活动以实际开放情况为准。</p><div class="detail"><b>时差</b><span>越南为 UTC+7，比中国、新加坡及马来西亚慢1小时。</span></div><div class="detail"><b>饮水</b><span>建议饮用密封瓶装水，注意饮食卫生。</span></div></section>`}
function render(){tabs.hidden=view!=='trip';document.querySelector('.nav').innerHTML=navItems.map(([id,label])=>`<button data-view="${id}" class="${view===id?'active':''}" aria-current="${view===id?'page':'false'}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[id]}"/></svg>${label}</button>`).join('');if(view==='trip'){content.setAttribute('role','tabpanel');content.setAttribute('aria-labelledby',`date-${current}`);content.innerHTML=dayPage(current)}else{content.removeAttribute('role');content.removeAttribute('aria-labelledby');if(view==='overview')content.innerHTML=overview();if(view==='contacts')content.innerHTML=contactsPage();if(view==='saved')content.innerHTML=`<div class="section-label">COLLECTED MOMENTS · 我的收藏</div>`+(saved.length?saved.map(i=>summary(i)+`<button class="subtle" data-day="${i}" style="margin:0 0 18px">查看完整安排 ↗</button>`).join(''):'<div class="card empty"><h2>收藏你的期待</h2><p class="muted">点击每日卡片右上角的爱心，<br>将想回看的行程留在这里。</p></div>');if(view==='words')content.innerHTML='<section class="card"><div class="eyebrow">A FEW LOCAL WORDS</div><h2>旅途中，用得上的越南语</h2>'+[['Xin chào','你好'],['Cảm ơn','谢谢'],['Xin lỗi','对不起 / 不好意思'],['Bao nhiêu tiền?','多少钱？'],['Nhà vệ sinh ở đâu?','洗手间在哪里？']].map(([a,b])=>`<div class="phrase"><b>${a}</b><span>${b}</span></div>`).join('')+'</section>';if(view==='pack')content.innerHTML=packingPage()}content.innerHTML+='<div class="footer">VN5HAS · 5天4晚河内／沙坝／莫阿纳之旅<br>行程、酒店、餐食及交通以旅行社最终确认为准。</div>';tabs.querySelectorAll('button').forEach((b,i)=>{b.setAttribute('aria-selected',i===current);b.tabIndex=i===current?0:-1})}
dates.forEach((d,i)=>{let b=document.createElement('button');b.id=`date-${i}`;b.setAttribute('role','tab');b.setAttribute('aria-controls','content');b.innerHTML=`<b>${d}</b><small>D${i+1} · ${weekdays[i]}</small>`;b.onclick=()=>{current=i;render()};b.onkeydown=e=>{let n;if(e.key==='ArrowRight')n=(i+1)%5;if(e.key==='ArrowLeft')n=(i+4)%5;if(e.key==='Home')n=0;if(e.key==='End')n=4;if(n!==undefined){e.preventDefault();current=n;render();tabs.children[n].focus()}};tabs.append(b)});
document.addEventListener('click',e=>{const n=e.target.closest('[data-view]'),s=e.target.closest('[data-save]'),d=e.target.closest('[data-day]');if(n){view=n.dataset.view;render();window.scrollTo(0,0)}if(s){let i=Number(s.dataset.save);saved=saved.includes(i)?saved.filter(x=>x!==i):[...saved,i];persist();render()}if(d){current=Number(d.dataset.day);view='trip';render();window.scrollTo(0,0)}if(e.target.id==='print')window.print()});document.addEventListener('change',e=>{if(e.target.matches('[data-check]')){let i=e.target.dataset.check;checks=e.target.checked?[...new Set([...checks,i])]:checks.filter(x=>x!==i);persist();const progress=document.querySelector('#pack-progress');if(progress){const total=packingGroups.reduce((n,g)=>n+g[2].length,0);const count=packingGroups.reduce((n,g,gi)=>n+g[2].filter((_,j)=>checks.includes(`pack-${gi}-${j}`)).length,0);progress.textContent=`已准备 ${count} / ${total} 项`}}});
window.addEventListener('beforeprint',()=>{content.innerHTML=days.map((d,i)=>dayPage(i)).join('')});window.addEventListener('afterprint',render);render();loadWeather();
</script></body></html>
